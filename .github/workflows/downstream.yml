name: downstream

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      frit-sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }} 的 Frit 兼容检查
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [stox, pop, proxi, meno]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.frit-sha || github.sha }}
          path: frit
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: whrss9527/${{ matrix.app }}
          ref: main
          path: app
          persist-credentials: false
      - name: 选择 Xcode
        run: bash frit/scripts/release/select-xcode.sh
      - name: 固定已有 Frit 依赖
        id: pin
        env:
          FRIT_SHA: ${{ inputs.frit-sha || github.sha }}
        run: python3 frit/scripts/downstream/pin.py app "$FRIT_SHA" >> "$GITHUB_OUTPUT"
      - name: 尚未接入 Frit
        if: steps.pin.outputs.active != 'true'
        run: echo 'App 的 main 尚未声明 Frit Swift 包，此列尚不生效。'
      - name: 编译
        id: build
        if: steps.pin.outputs.active == 'true'
        env:
          FRIT_APP: ${{ matrix.app }}
        run: bash frit/scripts/downstream/run.sh "$FRIT_APP" build
      - name: 单元测试
        id: test
        if: steps.pin.outputs.active == 'true'
        env:
          FRIT_APP: ${{ matrix.app }}
        run: bash frit/scripts/downstream/run.sh "$FRIT_APP" test
      - name: 更新端到端
        id: update
        if: steps.pin.outputs.active == 'true'
        env:
          FRIT_APP: ${{ matrix.app }}
        run: bash frit/scripts/downstream/run.sh "$FRIT_APP" update
      - name: 检查结果
        if: always()
        env:
          FRIT_APP: ${{ matrix.app }}
          FRIT_SHA: ${{ inputs.frit-sha || github.sha }}
          ACTIVE: ${{ steps.pin.outputs.active }}
          PIN: ${{ steps.pin.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          UPDATE: ${{ steps.update.outcome }}
        run: |
          app_sha=$(git -C app rev-parse HEAD 2>/dev/null || echo unavailable)
          {
            printf '### %s\n\n' "$FRIT_APP"
            printf 'Frit %s · App %s\n\n' "$FRIT_SHA" "$app_sha"
            if [ "$ACTIVE" != true ] && [ "$PIN" = success ]; then
              printf '尚未声明 Frit Swift 包：未运行，待 App 接入后自动生效。\n'
            else
              printf '| 固定依赖 | 编译 | 单元测试 | 更新 e2e |\n| --- | --- | --- | --- |\n'
              printf '| %s | %s | %s | %s |\n' "$PIN" "$BUILD" "$TEST" "$UPDATE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: downstream-${{ matrix.app }}
          path: |
            app/build.log
            app/test.log
            app/shots/*.log
            app/screenshots/*.log
            app/build/**/*.log
          if-no-files-found: ignore
