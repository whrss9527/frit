name: ci

# 每次推送（任何分支）跑一遍。不用 pull_request 触发：合并请求显示的就是它分支上这次推送的结果，
# 两个都开的话同一个提交要跑两遍，macOS runner 排队的时间也翻倍。
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: FritCore 测试、脚本检查（Linux）
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: 安装附件测试依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: 单元测试
        run: swift test
      - name: 发布逻辑与附件清单测试
        run: python3 -m unittest discover -s Tests/release -p 'test_*.py'
      - name: changelog.sh 测试
        run: Tests/release/test-changelog.sh
      - name: Frit 版本标签测试
        run: Tests/release/test-tag-version.sh
      - name: 公证超时与重试逻辑测试
        run: Tests/release/test-notarize.sh
      - name: plan.sh、publish.sh 测试
        run: Tests/release/test-publish.sh

  lint:
    name: shellcheck、actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -x scripts/release/*.sh Tests/release/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  macos:
    name: 单元测试、发布脚本自测（macOS）
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 选择最新的 Xcode
        run: scripts/release/select-xcode.sh
      - name: 单元测试
        run: swift test
      - name: 发布逻辑与附件清单测试
        run: python3 -m unittest discover -s Tests/release -p 'test_*.py'
      - name: 发布脚本自测
        run: Tests/release/test-scripts.sh
      - name: Frit 版本标签测试（macOS 自带的 bash 3.2）
        run: Tests/release/test-tag-version.sh
      - name: 公证超时与重试逻辑测试（macOS 自带的 bash 3.2）
        run: Tests/release/test-notarize.sh
      - name: plan.sh、publish.sh 测试（macOS 自带的 bash 3.2）
        run: Tests/release/test-publish.sh

  release-dry-run:
    name: 发布流程试运行
    # 用示例 App 把可复用的发布工作流从头到尾走一遍（不打标签、不发布），确认 App 仓库调用时能用。
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    with:
      app-name: Sample
      build-command: >-
        Tests/release/make-sample-app.sh dist &&
        "$FRIT_RELEASE/thin-archives.sh" dist/Sample.app dist/Sample-macos dist/Sample.entitlements &&
        (cd dist && ditto -c -k --keepParent Sample.app Sample-macos.zip) &&
        printf '{"plugins":[]}\n' > dist/plugins.json
      archives: dist/Sample-macos.zip dist/Sample-macos-arm64.zip dist/Sample-macos-x86_64.zip
      extra-assets: dist/plugins.json
      asset-aliases: dist/Sample-macos.zip=dist/LegacySample-macos.zip
      test-command: ""
      frit-ref: ${{ github.sha }}
      dry-run: true
