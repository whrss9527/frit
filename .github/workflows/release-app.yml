name: release-app

# 给 Pop、Meno、Stox、Proxi 这类菜单栏 App 发版的可复用工作流。App 仓库里这样调用：
#
#   jobs:
#     release:
#       uses: whrss9527/Frit/.github/workflows/release-app.yml@<Frit 的提交或标签>
#       with:
#         app-name: Stox
#         build-command: UNIVERSAL=1 scripts/build-app.sh && cd dist && ditto -c -k --keepParent Stox.app Stox.zip
#         archives: dist/Stox.zip
#         frit-ref: <和上面同一个提交或标签>
#       secrets: inherit
#
# 流程：
#   1. 定版本：没填 tag 时取 CHANGELOG.md 最上面的版本；这个版本已经有标签就不发（除非 overwrite）。
#   2. 在 macOS 上跑测试、导入 Developer ID 证书（Secrets 里有时）、执行 build-command 打包。
#      build-command 能用到的环境变量：VERSION、BUILD_NUMBER、CODESIGN_IDENTITY、CODESIGN_KEYCHAIN、FRIT_RELEASE（Frit 发布脚本所在的目录）。
#      它要把 archives 列出的 zip 都生成好，每个 zip 最外层是一个签好名的 .app。
#   3. 有证书和公证凭据时提交苹果公证并钉上票据；生成 SHA256SUMS.txt。
#   4. 发布说明取 CHANGELOG.md 里这个版本的一节（或者 notes-command 的输出），先建草稿 Release，附件传完再公开。
# Secrets 怎么配见 Frit 的 docs/release.md；没配证书时照旧 ad-hoc 签名，日志里有警告。

on:
  workflow_call:
    inputs:
      app-name:
        description: "App 的名字，用在 Release 标题里，比如 Stox"
        required: true
        type: string
      build-command:
        description: "打包命令，要生成 archives 里列出的所有 zip"
        required: true
        type: string
      archives:
        description: "要上传的 zip，空格分隔，都要在同一个文件夹里，比如 dist/Stox.zip"
        required: true
        type: string
      test-command:
        description: "打包前跑的测试，留空不跑"
        required: false
        type: string
        default: swift test
      tag:
        description: "要发布的标签，比如 v0.46.0；留空时取 CHANGELOG.md 最上面的版本"
        required: false
        type: string
        default: ""
      ref:
        description: "在哪个提交上发布；留空用触发这次运行的提交。标签已存在时用标签指向的提交"
        required: false
        type: string
        default: ""
      notes-command:
        description: "生成发布说明的命令，会在末尾加上标签作为参数，输出到标准输出；留空时用 CHANGELOG.md 里这个版本的一节"
        required: false
        type: string
        default: ""
      prerelease:
        description: "作为测试版（预发布）发布"
        required: false
        type: boolean
        default: false
      overwrite:
        description: "标签已存在时仍然重新打包，替换附件"
        required: false
        type: boolean
        default: false
      frit-ref:
        description: "用 Frit 的哪个提交或标签里的发布脚本，和 uses 里 @ 后面的保持一致"
        required: false
        type: string
        default: main
      dry-run:
        description: "只打包、签名、公证，不打标签也不发布，把 zip 和校验和作为这次运行的附件上传（Frit 自己的 CI 用它测试整个流程）"
        required: false
        type: boolean
        default: false
      runner:
        description: "打包用的 runner"
        required: false
        type: string
        default: macos-15
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      NOTARY_KEY_P8:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER_ID:
        required: false
      NOTARY_APPLE_ID:
        required: false
      NOTARY_PASSWORD:
        required: false
      NOTARY_TEAM_ID:
        required: false
    outputs:
      tag:
        description: "这次发布的标签；没有发布时为空"
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: write

jobs:
  plan:
    name: 定版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@v5
        with:
          repository: whrss9527/Frit
          ref: ${{ inputs.frit-ref }}
          path: .frit
      - name: 看要不要发版
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ -z "$TAG" ]; then
            version="$(.frit/scripts/release/changelog.sh version CHANGELOG.md)"
            TAG="v${version}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::标签格式应该是 v主版本.次版本.修订号，比如 v0.46.0（现在是 ${TAG}）"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [ "$DRY_RUN" = "true" ]; then
            echo "试运行 ${TAG}，提交 ${sha}（不打标签、不发布）"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "${TAG} 已经发布过，这次不发版。要发版就在 CHANGELOG.md 最上面加一节新版本。"
              exit 0
            fi
            git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            sha="$(git rev-parse "${TAG}^{commit}")"
            echo "${TAG} 已存在，在它指向的提交 ${sha} 上重新打包"
          else
            echo "发布 ${TAG}，提交 ${sha}"
          fi
          {
            echo "tag=${TAG}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  release:
    name: 打包并发布
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # 同一个 App 同一时间只发一个版本。
    concurrency:
      group: frit-release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      APP_NAME: ${{ inputs.app-name }}
      ARCHIVES: ${{ inputs.archives }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # BUILD_NUMBER 用提交数，要完整历史。
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: whrss9527/Frit
          ref: ${{ inputs.frit-ref }}
          path: .frit
      - name: 准备
        run: |
          {
            echo "FRIT_RELEASE=${GITHUB_WORKSPACE}/.frit/scripts/release"
            echo "VERSION=${TAG#v}"
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >> "$GITHUB_ENV"
      - name: 选择最新的 Xcode
        run: .frit/scripts/release/select-xcode.sh
      - name: 测试
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
      - name: 导入签名证书
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::没有配置 MACOS_CERTIFICATE_P12：这次用 ad-hoc 签名、不公证，用户第一次打开会被系统拦下。配置方法见 https://github.com/whrss9527/Frit/blob/main/docs/release.md"
            exit 0
          fi
          .frit/scripts/release/import-certificate.sh
      - name: 打包
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          bash -c "$BUILD_COMMAND"
          dir=""
          for archive in $ARCHIVES; do
            [ -f "$archive" ] || { echo "::error::打包命令没有生成 ${archive}"; exit 1; }
            this="$(cd "$(dirname "$archive")" && pwd)"
            [ -z "$dir" ] || [ "$dir" = "$this" ] || { echo "::error::archives 里的 zip 要在同一个文件夹里"; exit 1; }
            dir="$this"
          done
          echo "ARCHIVE_DIR=${dir}" >> "$GITHUB_ENV"
          ls -la "$dir"
      - name: 检查签名
        run: |
          for archive in $ARCHIVES; do
            work="$RUNNER_TEMP/check-$(basename "$archive" .zip)"
            rm -rf "$work" && mkdir -p "$work"
            ditto -x -k "$archive" "$work"
            app="$(find "$work" -maxdepth 1 -name '*.app' -type d | head -1)"
            [ -n "$app" ] || { echo "::error::${archive} 的最外层没有 .app"; exit 1; }
            codesign --verify --deep --strict "$app"
            app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            [ "$app_version" = "$VERSION" ] || { echo "::error::${archive} 里的版本号是 ${app_version}，应该是 ${VERSION}"; exit 1; }
            echo "$(basename "$archive")：版本 ${app_version}，$(codesign -dvv "$app" 2>&1 | awk -F= '/^Authority=/{print $2; exit}' || true)"
            if [ -n "${CODESIGN_IDENTITY:-}" ]; then
              info="$(codesign -dvv "$app" 2>&1)"
              echo "$info" | grep -q "flags=.*runtime" || { echo "::error::${archive} 没有开 hardened runtime，公证不会通过"; exit 1; }
              echo "$info" | grep -q "^Timestamp=" || { echo "::error::${archive} 没有安全时间戳，公证不会通过"; exit 1; }
            fi
          done
      - name: 提交苹果公证并钉上票据
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -z "${CODESIGN_IDENTITY:-}" ]; then
            echo "没有开发者证书，跳过公证"
            exit 0
          fi
          if [ -z "$NOTARY_KEY_P8" ] && [ -z "$NOTARY_APPLE_ID" ]; then
            echo "::warning::有证书但没有配置公证凭据（NOTARY_KEY_P8 或 NOTARY_APPLE_ID）：这次只签名、不公证，用户第一次打开仍会被系统拦下"
            exit 0
          fi
          # shellcheck disable=SC2086
          .frit/scripts/release/notarize.sh $ARCHIVES
          echo "NOTARIZED=1" >> "$GITHUB_ENV"
      - name: 校验和
        run: |
          names=""
          for archive in $ARCHIVES; do
            names="${names} $(basename "$archive")"
          done
          # shellcheck disable=SC2086
          (cd "$ARCHIVE_DIR" && shasum -a 256 $names > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: 发布说明
        env:
          NOTES_COMMAND: ${{ inputs.notes-command }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -n "$NOTES_COMMAND" ]; then
            bash -c "$NOTES_COMMAND \"\$1\"" _ "$TAG" > "$notes"
          else
            if ! .frit/scripts/release/changelog.sh notes "$TAG" CHANGELOG.md > "$notes"; then
              echo "::warning::CHANGELOG.md 里没有 ${VERSION} 这一节，发布说明留空"
              : > "$notes"
            fi
            if [ "${NOTARIZED:-}" = "1" ]; then
              printf '\n\n已用 Developer ID 签名并通过苹果公证，下载解压后双击就能打开。\n' >> "$notes"
            fi
          fi
          echo "NOTES_FILE=${notes}" >> "$GITHUB_ENV"
          cat "$notes"
      - name: 上传到这次运行的附件（试运行）
        if: inputs.dry-run
        uses: actions/upload-artifact@v5
        with:
          name: release-dry-run
          path: |
            ${{ env.ARCHIVE_DIR }}/*.zip
            ${{ env.ARCHIVE_DIR }}/SHA256SUMS.txt
            ${{ env.NOTES_FILE }}
      - name: 发布
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/${TAG}"
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "${APP_NAME} ${TAG}" --notes-file "$NOTES_FILE" "${flags[@]}"
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi
          files=()
          for archive in $ARCHIVES; do
            files+=("$archive")
          done
          files+=("${ARCHIVE_DIR}/SHA256SUMS.txt")
          gh release upload "$TAG" "${files[@]}" --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "已发布到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          {
            echo "### ${APP_NAME} ${TAG} 已发布"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 删除临时钥匙串
        if: always() && env.CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$CODESIGN_KEYCHAIN" || true
