name: release-app

# 给 Pop、Meno、Stox、Proxi 这类菜单栏 App 发版的可复用工作流。App 仓库里这样调用：
#
#   jobs:
#     release:
#       uses: whrss9527/Frit/.github/workflows/release-app.yml@<Frit 的提交或标签>
#       with:
#         app-name: Stox
#         build-command: UNIVERSAL=1 scripts/build-app.sh && cd dist && ditto -c -k --keepParent Stox.app Stox.zip
#         archives: dist/Stox.zip
#         frit-ref: <和上面同一个提交或标签>
#       secrets:
#         MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
#         MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
#         NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
#         NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
#         NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
#         NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
#         NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
#         NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
#
# 流程：
#   1. 定版本：没填 tag 时取 CHANGELOG.md 最上面的版本；这个版本已经发过就不发（除非 overwrite）。
#      标签打了、但上次没发完（Release 还是草稿或者缺附件）时，在标签指向的提交上接着发。
#   2. 在 macOS 上跑测试、导入 Developer ID 证书（Secrets 里有时）、执行 build-command 打包。
#      build-command 能用到的环境变量：VERSION、BUILD_NUMBER、CODESIGN_IDENTITY、CODESIGN_KEYCHAIN、FRIT_RELEASE（Frit 发布脚本所在的目录）。
#      它要把 archives 列出的 zip 都生成好，每个 zip 最外层是一个签好名的 .app。
#   3. 有证书和公证凭据时提交苹果公证并钉上票据；生成 SHA256SUMS.txt。
#   4. 发布说明取 CHANGELOG.md 里这个版本的一节（或者 notes-command 的输出），先建草稿 Release，附件传完再公开。
#      发布前再核对一次标签：连续推送时另一次运行已经把这个版本发在别的提交上，就不上传这次的包。
# Secrets 怎么配见 Frit 的 docs/release.md；没配证书时照旧 ad-hoc 签名，日志里有警告。

on:
  workflow_call:
    inputs:
      app-name:
        description: "App 的名字，用在 Release 标题里，比如 Stox"
        required: true
        type: string
      build-command:
        description: "打包命令，要生成 archives 里列出的所有 zip"
        required: true
        type: string
      archives:
        description: "要上传的 zip，空格分隔，都要在同一个文件夹里，比如 dist/Stox.zip"
        required: true
        type: string
      extra-assets:
        description: "只上传并计算校验和的额外附件，空格分隔，与 archives 在同一目录；签名公证由调用方负责"
        type: string
        default: ""
      asset-aliases:
        description: "公证后复制的 zip 别名，空格分隔的 源归档=目标路径；均在归档目录，目标必须不存在"
        type: string
        default: ""
      test-command:
        description: "打包前跑的测试，留空不跑"
        required: false
        type: string
        default: swift test
      update-e2e-command:
        description: "签名、公证和校验和之后验证旧正式版更新到本次构建；失败不发布，试运行也执行"
        type: string
        default: ""
      tag:
        description: "要发布的标签，比如 v0.46.0；留空时取 CHANGELOG.md 最上面的版本"
        required: false
        type: string
        default: ""
      ref:
        description: "在哪个提交上发布；留空用触发这次运行的提交。标签已存在时用标签指向的提交"
        required: false
        type: string
        default: ""
      notes-command:
        description: "生成发布说明的命令，会在末尾加上标签作为参数，输出到标准输出；留空时用 CHANGELOG.md 里这个版本的一节"
        required: false
        type: string
        default: ""
      prerelease:
        description: "作为测试版（预发布）发布"
        required: false
        type: boolean
        default: false
      overwrite:
        description: "标签已存在时仍然重新打包，替换附件"
        required: false
        type: boolean
        default: false
      frit-ref:
        description: "用 Frit 的哪个提交或标签里的发布脚本，和 uses 里 @ 后面的保持一致"
        required: false
        type: string
        default: main
      require-notarization:
        description: "必须用 Developer ID 签名并通过公证：没配证书或公证凭据、或者公证没通过时直接失败，不打标签也不发布"
        required: false
        type: boolean
        default: true
      team-id:
        description: "预期的 10 位 Developer ID Team ID；非空时核对每个归档的签名团队"
        type: string
        default: ""
      dry-run:
        description: "只打包、签名、公证，不打标签也不发布，把 zip 和校验和作为这次运行的附件上传（Frit 自己的 CI 用它测试整个流程）"
        required: false
        type: boolean
        default: false
      runner:
        description: "打包用的 runner"
        required: false
        type: string
        default: macos-15
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      NOTARY_KEY_P8:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER_ID:
        required: false
      NOTARY_APPLE_ID:
        required: false
      NOTARY_PASSWORD:
        required: false
      NOTARY_TEAM_ID:
        required: false
    outputs:
      tag:
        description: "这次发布的标签；没有发布时为空"
        value: ${{ jobs.release.outputs.tag }}
      assets:
        description: "应用归档、额外附件、别名的 JSON 数组，每项包含 name 和 sha256；没有构建时为空，试运行也输出"
        value: ${{ jobs.release.outputs.assets }}

permissions:
  contents: write

jobs:
  plan:
    name: 定版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: whrss9527/Frit
          ref: ${{ inputs.frit-ref }}
          path: .frit
      - name: 检查 Frit 版本引用
        if: ${{ !inputs.dry-run && inputs.frit-ref == 'main' }}
        run: echo "::warning::frit-ref 仍是 main。正式发版请把 uses 的引用和 frit-ref 都固定到同一个 Frit 标签或完整提交 SHA。"
      - name: 看要不要发版
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          ARCHIVES: ${{ inputs.archives }}
          EXTRA_ASSETS: ${{ inputs.extra-assets }}
          ASSET_ALIASES: ${{ inputs.asset-aliases }}
          OVERWRITE: ${{ inputs.overwrite }}
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .frit/scripts/release/plan.sh

  release:
    name: 打包并发布
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # 正式发布按 App 串行；试运行按分支隔离，避免不同 PR 替换彼此的待运行任务。
    concurrency:
      group: ${{ inputs.dry-run && format('frit-release-dry-run-{0}-{1}', github.repository, github.ref) || format('frit-release-{0}', github.repository) }}
      cancel-in-progress: false
    outputs:
      # 只有真的发布了才有值（试运行、另一次运行先发了时为空）。
      tag: ${{ steps.publish.outputs.tag }}
      assets: ${{ steps.assets.outputs.assets }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      APP_NAME: ${{ inputs.app-name }}
      ARCHIVES: ${{ inputs.archives }}
      EXTRA_ASSETS: ${{ inputs.extra-assets }}
      ASSET_ALIASES: ${{ inputs.asset-aliases }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # BUILD_NUMBER 用提交数，要完整历史。
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: whrss9527/Frit
          ref: ${{ inputs.frit-ref }}
          path: .frit
      - name: 准备
        run: |
          {
            echo "FRIT_RELEASE=${GITHUB_WORKSPACE}/.frit/scripts/release"
            echo "VERSION=${TAG#v}"
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >> "$GITHUB_ENV"
      - name: 选择最新的 Xcode
        run: .frit/scripts/release/select-xcode.sh
      - name: 测试
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
      - name: 导入签名证书
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::没有配置 MACOS_CERTIFICATE_P12：这次用 ad-hoc 签名、不公证，用户第一次打开会被系统拦下。配置方法见 https://github.com/whrss9527/Frit/blob/main/docs/release.md"
            exit 0
          fi
          .frit/scripts/release/import-certificate.sh
      - name: 打包
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          bash -c "$BUILD_COMMAND"
          dir=""
          for archive in $ARCHIVES; do
            [ -f "$archive" ] || { echo "::error::打包命令没有生成 ${archive}"; exit 1; }
            this="$(cd "$(dirname "$archive")" && pwd)"
            [ -z "$dir" ] || [ "$dir" = "$this" ] || { echo "::error::archives 里的 zip 要在同一个文件夹里"; exit 1; }
            dir="$this"
          done
          echo "ARCHIVE_DIR=${dir}" >> "$GITHUB_ENV"
          ls -la "$dir"
      - name: 检查签名
        env:
          TEAM_ID: ${{ inputs.team-id }}
        run: .frit/scripts/release/check-signature.sh
      - name: 提交苹果公证并钉上票据
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -z "${CODESIGN_IDENTITY:-}" ]; then
            echo "没有开发者证书，跳过公证"
            exit 0
          fi
          if [ -z "$NOTARY_KEY_P8" ] && [ -z "$NOTARY_APPLE_ID" ]; then
            echo "::warning::有证书但没有配置公证凭据（NOTARY_KEY_P8 或 NOTARY_APPLE_ID）：这次只签名、不公证，用户第一次打开仍会被系统拦下"
            exit 0
          fi
          # shellcheck disable=SC2086
          .frit/scripts/release/notarize.sh $ARCHIVES
          echo "NOTARIZED=1" >> "$GITHUB_ENV"
      - name: 确认已公证
        if: inputs.require-notarization
        run: |
          if [ "${NOTARIZED:-}" != "1" ]; then
            echo "::error::这次调用要求 Developer ID 签名并通过公证（require-notarization），但没有做到：检查仓库 Secrets 里的 MACOS_CERTIFICATE_P12、MACOS_CERTIFICATE_PASSWORD 和公证凭据（见 Frit 的 docs/release.md）。没有打标签，也没有发布。"
            exit 1
          fi
          echo "已签名并通过公证"
      - name: 别名、附件清单与校验和
        id: assets
        run: .frit/scripts/release/assets.sh
      - name: 发布说明
        env:
          NOTES_COMMAND: ${{ inputs.notes-command }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if [ -n "$NOTES_COMMAND" ]; then
            bash -c "$NOTES_COMMAND \"\$1\"" _ "$TAG" > "$notes"
          else
            if ! .frit/scripts/release/changelog.sh notes "$TAG" CHANGELOG.md > "$notes"; then
              echo "::warning::CHANGELOG.md 里没有 ${VERSION} 这一节，发布说明留空"
              : > "$notes"
            fi
            if [ "${NOTARIZED:-}" = "1" ]; then
              printf '\n\n已用 Developer ID 签名并通过苹果公证，下载解压后双击就能打开。\n' >> "$notes"
            fi
          fi
          echo "NOTES_FILE=${notes}" >> "$GITHUB_ENV"
          cat "$notes"
      - name: 验证旧正式版到本次构建的更新
        if: inputs.update-e2e-command != ''
        env:
          UPDATE_E2E_COMMAND: ${{ inputs.update-e2e-command }}
        run: .frit/scripts/release/update-e2e.sh
      - name: 上传到这次运行的附件（试运行）
        if: inputs.dry-run
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-dry-run
          path: |
            ${{ steps.assets.outputs.paths }}
            ${{ env.ARCHIVE_DIR }}/SHA256SUMS.txt
            ${{ env.ASSET_MANIFEST }}
            ${{ env.NOTES_FILE }}
      - name: 发布
        id: publish
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: .frit/scripts/release/publish.sh
      - name: 删除临时钥匙串
        if: always() && env.CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$CODESIGN_KEYCHAIN" || true
